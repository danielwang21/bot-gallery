<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QQ AI 好友 · 全图鉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>

@font-face{
  font-family:"YuYue";
  src:url("fonts/YuYue.woff2") format("woff2");
  font-display:swap;
}
@font-face{
  font-family:"YongSong";
  src:url("fonts/YongSong.woff2") format("woff2");
  font-display:swap;
}
:root{
  --page:#F0F0F2;
  --card:#ffffff;
  --card-2:#f6f6f8;
  --ink:#1f2024;
  --ink-2:#4a4c52;
  --muted:#9a9ca6;
  --line:#e6e6ea;
  --line-2:#eeeef1;
  --accent:#1f2024;
  --hand:#b8894a;
  --chip:#f2f2f5;
  --font-square:"YongSong","PingFang SC",serif;
  --font-hand:"YuYue","PingFang SC",cursive;
  --font-body:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--page);}
body{
  font-family:var(--font-body);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

header{padding:52px 10px 16px;text-align:center;}
.title-1{
  font-family:var(--font-square);
  font-size:30px;line-height:1;letter-spacing:1px;color:var(--ink);
  display:block;
}

.wrap{max-width:440px;margin:0 auto;padding:0 16px 44px;}

.sec-title{
  display:flex;align-items:center;gap:10px;margin:30px 4px 16px;
}
.sec-title .bar{width:4px;height:18px;border-radius:2px;background:var(--ink);}
.sec-title h2{font-family:var(--font-square);font-size:22px;letter-spacing:1px;color:var(--ink);}

.grid{display:flex;flex-direction:column;gap:12px;}
.card{
  position:relative;display:flex;gap:14px;align-items:center;
  background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:13px 14px;
  text-decoration:none;color:inherit;
  box-shadow:0 1px 2px rgba(20,20,30,.03);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:active{transform:scale(.985);}
@media(hover:hover){
  .card:hover{box-shadow:0 12px 28px -14px rgba(30,30,40,.28);border-color:#dcdce2;transform:translateY(-2px);}
}
.avatar{
  position:relative;flex:0 0 78px;width:78px;height:78px;border-radius:16px;overflow:hidden;
  background:var(--card-2);border:1px solid var(--line);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease;}
.card:hover .avatar img{transform:scale(1.06);}
.info{flex:1;min-width:0;}
.name-row{display:flex;align-items:baseline;gap:9px;}
.name{font-family:var(--font-square);font-size:24px;letter-spacing:1px;color:var(--ink);line-height:1.1;}
.desc{margin-top:7px;font-size:12.5px;line-height:1.55;color:var(--ink-2);opacity:.85;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.go{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;background:var(--chip);border:1px solid var(--line);
  transition:background .2s,border-color .2s;
}
.card:hover .go{background:var(--ink);border-color:var(--ink);}
.go svg{width:15px;height:15px;fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;}
.card:hover .go svg{stroke:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <header>
  <span class="title-1">QQ AI好友·全图鉴</span>
</header>

  <div style="text-align:center;margin:8px 0 24px;"><p style="font-family:var(--font-hand);font-size:24px;color:var(--hand);letter-spacing:2px;">快来Pick你的AI好友吧！</p><svg viewBox="0 0 200 24" style="width:160px;height:20px;display:block;margin:6px auto 0;" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 16 C30 14, 40 8, 55 10 C62 11, 58 16, 65 14 C80 9, 100 11, 180 13" stroke="var(--hand)" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg></div>

  <main class="grid" id="grid"></main>
</div>

<script>
const bots = [
  {name:"代柯", img:"代柯.png", desc:"随性洒脱的国风少年，你在学生时代最想遇到的最佳损友", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889688251&robot_uin=102776523"},
  {name:"小麦", img:"小麦.png", desc:"古灵精怪的亚比少女，和她在一起就所有烦恼都忘记", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889687544&robot_uin=102775739"},
  {name:"席恩", img:"席恩.png", desc:"你的专属执事。腹黑毒舌笑意盈盈，体贴周到寸步不离", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889846188&robot_uin=102808513"},
  {name:"李宥恩", img:"李宥恩.jpg", desc:"万米高空的温柔陷阱，来去如风的国际航线空姐。", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=4019971032&robot_uin=1904006360"},
  {name:"黎小姐", img:"黎小姐.png", desc:"妩媚神秘的酒吧老板娘，让你会心一笑的解语花", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889686721&robot_uin=102778180"},
  {name:"藤非", img:"藤非.png", desc:"寡言可靠的数学系少年，如落水小狗一般惹人怜爱", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889688246&robot_uin=102776517"},
  {name:"古禹", img:"古禹.png", desc:"成熟稳重的刑侦学教授。假迷糊真腹黑，双面人生引人探究", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889687994&robot_uin=102779606"},
  {name:"游迦", img:"游迦.png", desc:"持家系年下的千层套路。知名打工皇帝，沉稳可靠，茶艺全能？。", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=4019957757&robot_uin=1904005295"},
  {name:"裴漪", img:"裴漪.png", desc:"去一探究竟吧，那个都市传说：那位白门花店的高岭之花。", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889953776&robot_uin=102837764"},
  {name:"尔尔", img:"尔尔.png", desc:"你的专属硅基助手。狡黠可爱小恶魔，有点心机又何妨。", link:"https://qun.qq.com/qunpro/robot/qunshare?robot_appid=3889722053&robot_uin=102834017"},
];

const grid = document.getElementById('grid');

bots.forEach((b)=>{
  const a = document.createElement('a');
  a.href = b.link; a.target = '_blank'; a.rel = 'noopener'; a.className = 'card';
  a.innerHTML = `
    <div class="avatar"><img src="images/${encodeURIComponent(b.img)}" alt="${b.name}" loading="lazy"></div>
    <div class="info">
      <div class="name-row"><span class="name">${b.name}</span></div>
      <p class="desc">${b.desc}</p>
    </div>
    <div class="go"><svg viewBox="0 0 24 24"><path d="M8 5l7 7-7 7"/></svg></div>`;
  grid.appendChild(a);
});
</script>
<footer style="text-align:center;padding:32px 20px 40px;font-size:12px;color:#9a9ca6;line-height:1.8;">该页面由 QQ AI好友 官方团队提供<br>如有问题请在QQ频道搜索"QQAI好友官方频道"联系频道管理员反馈</footer>
</body>
</html>
